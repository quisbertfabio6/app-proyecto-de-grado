name: myapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.1.3
  sqflite: ^2.4.2
  path: ^1.9.1
  image_picker: ^1.2.1
  file_picker: ^10.3.6
  flutter_image_compress: ^2.5.1
  audioplayers: ^6.5.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Agregamos la librería de iconos aquí
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/icon/
    # (Asegúrate de que esta línea coincida con tu carpeta real)

# --- CONFIGURACIÓN DEL ICONO ---
# Esta parte va FUERA de la sección flutter:
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png" 
  min_sdk_android: 21